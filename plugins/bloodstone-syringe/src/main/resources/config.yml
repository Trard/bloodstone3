# Paper / Folia 1.21.11, Java 21. После изменения: /syringe reload
# Предметы помечаются PDC; обычный предмет с такой же моделью не станет шприцем.
config-version: 2
item:
  custom-model-data: 21011
  model: 'bloodstone:tools/syringe/default/syringe'
  empty-custom-model-data: 21012
  empty-model: 'bloodstone:tools/syringe/default/syringe_empty'
  name: 'Шприц с вакциной'
  # После укола всегда возвращается пустой шприц, в том числе в творческом режиме.
injection:
  # Синхронная задержка и визуальное затемнение предмета (3 секунды = 60 тиков).
  cooldown-seconds: 3.0
  max-distance: 3.0
  # Если PvP выключен в мире, вкалывать другим игрокам нельзя.
  respect-world-pvp: true
  particles: true
  sounds: true
  # Вероятность дебафа до передозировки.
  negative-chance: 0.5
overdose:
  threshold: 4
  window-seconds: 60
  negative-chance: 0.75
  # История уколов сохраняется при выходе и рестарте, очищается после смерти.
  clear-on-death: true
# Эффект выбирается равновероятно внутри выпавшей группы.
# level: 1 = I, 2 = II. seconds — длительность обычного укола.
# При передозировке используются overdose-seconds / overdose-level.
effects:
  positive:
    - {type: speed, seconds: 30, level: 1, overdose-seconds: 45, overdose-level: 2}
    - {type: haste, seconds: 30, level: 1, overdose-seconds: 45, overdose-level: 2}
    - {type: strength, seconds: 20, level: 1, overdose-seconds: 30, overdose-level: 2}
    - {type: regeneration, seconds: 10, level: 1, overdose-seconds: 15, overdose-level: 2}
    - {type: resistance, seconds: 20, level: 1, overdose-seconds: 30, overdose-level: 2}
    - {type: fire_resistance, seconds: 45, level: 1, overdose-seconds: 60, overdose-level: 1}
    - {type: jump_boost, seconds: 30, level: 1, overdose-seconds: 45, overdose-level: 2}
    - {type: water_breathing, seconds: 45, level: 1, overdose-seconds: 60, overdose-level: 1}
  negative:
    - {type: slowness, seconds: 20, level: 1, overdose-seconds: 35, overdose-level: 2}
    - {type: weakness, seconds: 20, level: 1, overdose-seconds: 35, overdose-level: 2}
    - {type: mining_fatigue, seconds: 20, level: 1, overdose-seconds: 35, overdose-level: 2}
    - {type: poison, seconds: 8, level: 1, overdose-seconds: 12, overdose-level: 2}
    - {type: nausea, seconds: 10, level: 1, overdose-seconds: 20, overdose-level: 1}
    - {type: blindness, seconds: 6, level: 1, overdose-seconds: 10, overdose-level: 1}
    - {type: hunger, seconds: 20, level: 1, overdose-seconds: 35, overdose-level: 2}
