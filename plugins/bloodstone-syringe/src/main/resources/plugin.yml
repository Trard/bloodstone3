name: BloodstoneSyringe
version: 1.1.0
main: ru.bloodstone.syringe.SyringePlugin
api-version: '1.21.11'
folia-supported: true
description: Шприцы со случайными эффектами и передозировкой
author: Bloodstone
commands:
  syringe:
    description: Выдача шприцев и настройки
    usage: /syringe give <игрок> [количество] | /syringe reload
    aliases: [syringes]
permissions:
  bloodstonesyringe.use:
    description: Использовать шприцы
    default: true
  bloodstonesyringe.admin:
    description: Выдавать шприцы и перезагружать конфиг
    default: op
